<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abnormal Lab Tool</title>
<style>body{font-family:Arial;margin:0;background:#f4f7f9;color:#1f2933}header{background:#17324d;color:#fff;padding:28px;text-align:center}main{max-width:900px;margin:auto;padding:18px}section{background:#fff;padding:20px;margin:16px 0;border-radius:10px}select,input{width:100%;padding:11px;margin:5px 0;box-sizing:border-box}button{padding:11px;border:0;border-radius:7px;background:#17324d;color:#fff;font-weight:bold;margin:5px}.secondary{background:#e9eef3;color:#17324d}.card{border:1px solid #d9e2ec;padding:13px;margin:10px 0;border-radius:8px}</style></head><body>
<header><h1>Abnormal Lab Interpretation & Treatment Guidance</h1></header><main><section><p><a href="index.html">Home</a></p>
<select id="lab"><option value="">Select lab</option><option value="sodium">Sodium</option><option value="potassium">Potassium</option><option value="hemoglobin">Hemoglobin</option><option value="creatinine">Creatinine</option><option value="glucose">Glucose</option></select>
<input id="value" type="number" step="0.01" placeholder="Value"><button id="analyze">Interpret & Guide</button><button id="add" class="secondary">Add to Patient Summary</button></section>
<section id="res" style="display:none"><div id="out"></div></section></main>
<script>
const G={
sodium:{n:"Sodium",u:"mmol/L",i:v=>v<130?"Hyponatremia":v>145?"Hypernatremia":"No major sodium abnormality",w:"Repeat sodium, review trend, glucose, volume status, medications; consider osmolality/urine studies when indicated.",t:v=>v<130?"Treat underlying cause; correct hypovolemia when present; use fluid restriction only when appropriate; avoid overly rapid correction.":"Replace free-water deficit carefully and treat the cause.",s:v=>v<125?"Not optimized":v<130||v>145?"Pending":"Optimized"},
potassium:{n:"Potassium",u:"mmol/L",i:v=>v<3.5?"Hypokalemia":v>5.1?"Hyperkalemia":"No major potassium abnormality",w:"Repeat if unexpected, check magnesium and renal function, review medications; obtain ECG for significant elevation or symptoms.",t:v=>v<3.5?"Replace potassium and magnesium as appropriate; treat cause.":"Confirm true hyperkalemia; review potassium-raising agents; treat significant/ECG-associated hyperkalemia urgently.",s:v=>v<3||v>5.5?"Not optimized":v<3.5||v>5.1?"Pending":"Optimized"},
hemoglobin:{n:"Hemoglobin",u:"g/dL",i:v=>v<10?"Anemia":v>=17.5?"Elevated hemoglobin / polycythemia":"No major hemoglobin abnormality",w:"Review CBC trend, MCV/RDW, iron studies when indicated, renal function and bleeding history.",t:v=>v<10?"Treat reversible cause; replace iron/B12/folate when deficient; transfuse only when clinically indicated.":"Correct dehydration, assess hypoxemia/OSA/COPD and consider hematology evaluation if persistent.",s:v=>v<8?"Not optimized":v<10||v>=17.5?"Pending":"Optimized"},
creatinine:{n:"Creatinine",u:"mg/dL",i:v=>v>=1.5?"Elevated creatinine":"Interpret against baseline",w:"Compare baseline/eGFR, repeat BMP if acute change possible, assess volume and nephrotoxins.",t:v=>v>=1.5?"Correct reversible volume depletion; renally dose medications; avoid nephrotoxins; evaluate AKI/obstruction as indicated.":"Use baseline and overall renal context.",s:v=>v>=3?"Pending":"Optimized"},
glucose:{n:"Glucose",u:"mg/dL",i:v=>v>=300?"Marked hyperglycemia":v>=200?"Hyperglycemia":v<60?"Hypoglycemia":"No major acute glucose red flag",w:"Review diabetes history, symptoms, medication plan; check ketones/anion gap if DKA risk.",t:v=>v>=200?"Correct hyperglycemia; use insulin per protocol when needed; manage SGLT2 risk appropriately.":v<60?"Treat hypoglycemia promptly.":"Continue appropriate diabetes plan.",s:v=>v>=300||v<60?"Not optimized":v>=200?"Pending":"Optimized"}};
const $=id=>document.getElementById(id);let last=null;
function analyze(){let k=$("lab").value,v=parseFloat($("value").value);if(!k||!Number.isFinite(v)){alert("Select a lab and enter a valid value.");return}let g=G[k],interp=g.i(v),status=g.s(v);last={finding:`${g.n}: ${v} ${g.u} â ${interp}`,workupTreatment:`Recommended workup: ${g.w} Treatment/optimization: ${g.t(v)}`,reason:`Preoperative status based on this lab: ${status}.`,status};$("out").innerHTML=`<div class="card"><h3>${last.finding}</h3><p><b>Recommended workup:</b> ${g.w}</p><p><b>Treatment / optimization:</b> ${g.t(v)}</p><p><b>Preoperative status:</b> ${status}</p></div>`;$("res").style.display="block"}
$("analyze").onclick=analyze;$("add").onclick=()=>{if(!last)analyze();if(!last)return;localStorage.setItem("tsjhLabSummary",JSON.stringify(last));window.location.href="patient-specific-preop-summary.html"};
</script></body></html>
