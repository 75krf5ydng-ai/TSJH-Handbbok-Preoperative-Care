<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient-Specific Preoperative Summary</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7f9;color:#1f2933;line-height:1.45}header{background:#17324d;color:#fff;padding:28px;text-align:center}
main{max-width:950px;margin:auto;padding:18px}section{background:#fff;padding:20px;margin:16px 0;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:bold;display:block;margin:5px 0}
input,select,textarea{width:100%;padding:11px;box-sizing:border-box}textarea{min-height:90px}
button{padding:11px 14px;border:0;border-radius:7px;background:#17324d;color:#fff;font-weight:bold;margin:5px}.secondary{background:#e9eef3;color:#17324d}
.status{padding:14px;border-radius:8px;font-weight:bold}.optimized{background:#eef9f1}.pending{background:#fff8e7}.notopt{background:#fff3f1}
.notice{background:#eef6fb;border-left:5px solid #3178a8;padding:12px;display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}
@media print{header,.no-print{display:none}body{background:#fff}}
</style></head><body>
<header><h1>Patient-Specific Preoperative Summary</h1><p>Printable provider summary</p></header><main>
<section class="no-print"><p><a href="index.html">Home</a> Â· <a href="abnormal-lab-interpretation.html">Abnormal Lab Tool</a></p>
<div id="notice" class="notice"><b>Imported from Abnormal Lab Tool.</b> Review before generating.</div>
<h2>Patient / Procedure</h2><div class="grid">
<div><label>Patient</label><input id="patient"></div><div><label>Date of Service</label><input id="dos" type="date"></div>
<div><label>Procedure</label><input id="procedure"></div><div><label>Surgeon</label><input id="surgeon"></div></div></section>

<section class="no-print"><h2>Risk / Screening</h2><div class="grid">
<div><label>DASI</label><input id="dasi"></div><div><label>STOP-BANG</label><input id="stopbang"></div>
<div><label>CFS</label><input id="cfs"></div><div><label>RCRI</label><input id="rcri"></div>
<div><label>Surgical Risk</label><select id="risk"><option value="">Select</option><option>Low</option><option>Intermediate</option><option>High</option></select></div>
<div><label>BNP Screening</label><select id="bnp"><option>No</option><option>Yes</option></select></div></div></section>

<section class="no-print"><h2>Key Findings</h2><div class="grid">
<div><label>Active cardiac problem</label><select id="cardiac"><option>No</option><option>Yes</option></select></div>
<div><label>HLOC criterion</label><select id="hloc"><option>No</option><option>Yes</option></select></div>
<div><label>Pending testing/review</label><select id="pending"><option>No</option><option>Yes</option></select></div>
<div><label>Status</label><select id="status"><option>Optimized</option><option>Pending</option><option>Not optimized</option></select></div></div>
<label>Reason / Key Issues</label><textarea id="reason"></textarea>
<label>Abnormal Labs / Diagnostics</label><textarea id="abnormals"></textarea>
<label>Recommended Workup / Treatment</label><textarea id="treatment"></textarea>
<label>Medication Issues / Holds</label><textarea id="meds"></textarea>
<label>Perioperative / Postoperative Plan</label><textarea id="plan"></textarea></section>

<section class="no-print"><button id="gen">Generate Summary</button><button id="copy" class="secondary">Copy</button><button id="print" class="secondary">Print</button><button id="clear" class="secondary">Clear</button></section>
<section id="resultSec" style="display:none"><div id="result"></div></section></main>
<script>
const $=id=>document.getElementById(id),v=id=>$(id).value.trim(),e=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function importLab(){try{let raw=localStorage.getItem("tsjhLabSummary");if(!raw)return;let d=JSON.parse(raw);$("abnormals").value=d.finding||"";$("treatment").value=d.workupTreatment||"";$("reason").value=d.reason||"";if(d.status)$("status").value=d.status;$("notice").style.display="block"}catch(x){}}
function gen(){let s=v("status"),c=s==="Optimized"?"optimized":s==="Pending"?"pending":"notopt";let h="<h2>Preoperative Provider Summary</h2>";
["patient","dos","procedure","surgeon"].forEach(id=>{if(v(id))h+=`<p><b>${id==="dos"?"Date of Service":id[0].toUpperCase()+id.slice(1)}:</b> ${e(v(id))}</p>`});
h+=`<div class="status ${c}">FINAL PREOPERATIVE OPTIMIZATION STATUS: ${e(s.toUpperCase())}</div>`;
if(v("reason"))h+=`<p><b>Reason:</b> ${e(v("reason"))}</p>`;
h+=`<h3>Functional & Risk Screening</h3><p>DASI: ${e(v("dasi")||"â")} | STOP-BANG: ${e(v("stopbang")||"â")} | CFS: ${e(v("cfs")||"â")} | RCRI: ${e(v("rcri")||"â")}</p>`;
h+=`<h3>Preoperative Cardiac Guidelines Application</h3><p>Surgical Risk: ${e(v("risk")||"â")}<br>RCRI: ${e(v("rcri")||"â")}<br>Active Cardiac Problems: ${e(v("cardiac"))}<br>BNP Screening: ${e(v("bnp"))}</p>`;
if(v("abnormals"))h+=`<h3>Abnormal Labs / Diagnostics</h3><p>${e(v("abnormals"))}</p>`;
if(v("treatment"))h+=`<h3>Recommended Workup / Treatment</h3><p>${e(v("treatment"))}</p>`;
if(v("meds"))h+=`<h3>Medication Issues / Holds</h3><p>${e(v("meds"))}</p>`;
if(v("plan"))h+=`<h3>Perioperative / Postoperative Plan</h3><p>${e(v("plan"))}</p>`;
$("result").innerHTML=h;$("resultSec").style.display="block"}
$("gen").onclick=gen;$("print").onclick=()=>{if($("resultSec").style.display==="none")gen();window.print()};
$("copy").onclick=async()=>{if($("resultSec").style.display==="none")gen();try{await navigator.clipboard.writeText($("result").innerText);alert("Summary copied.")}catch(x){alert("Select the generated text manually to copy.")}};
$("clear").onclick=()=>{document.querySelectorAll("input,textarea").forEach(x=>x.value="");document.querySelectorAll("select").forEach(x=>x.selectedIndex=0);localStorage.removeItem("tsjhLabSummary");$("notice").style.display="none";$("resultSec").style.display="none"};
importLab();
</script></body></html>
